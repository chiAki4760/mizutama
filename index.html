<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>みずたまジグソー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one glass drop holding the goldfish pond floats up top; torn drops scatter over the wet dotted ground below; quiet controls sit in the corners */
:root{
  --bg1:#e6f2ee; --bg2:#c9e0d9; --ink:#23444a; --ink-soft:#587a7d; --dot:#a7c9c2;
  --chip:rgba(255,255,255,.62); --line:rgba(35,68,74,.16); --shadow:rgba(18,66,72,.32);
  --ghost:#d8ece7; --tint:#bfe9f0; --accent:#d24d2c;
  --glass1:rgba(255,255,255,.82);--glass2:rgba(255,255,255,.56);--hi:rgba(255,255,255,.9);--well:rgba(35,68,74,.07);--sel:#ffffff;--ring:#2f8f8a;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#0d1c1f; --bg2:#0b2a2b; --ink:#d4ecea; --ink-soft:#8db1ad; --dot:#1e4448;
  --chip:rgba(18,48,52,.66); --line:rgba(212,236,234,.16); --shadow:rgba(0,0,0,.55);
  --ghost:#0f2f33; --tint:#7fd3df; --accent:#f0805e; --glass1:rgba(40,78,82,.78);--glass2:rgba(18,48,52,.62);--hi:rgba(255,255,255,.08);--well:rgba(212,236,234,.07);--sel:#2a5559;--ring:#7fd3df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#0d1c1f; --bg2:#0b2a2b; --ink:#d4ecea; --ink-soft:#8db1ad; --dot:#1e4448;
  --chip:rgba(18,48,52,.66); --line:rgba(212,236,234,.16); --shadow:rgba(0,0,0,.55);
  --ghost:#0f2f33; --tint:#7fd3df; --accent:#f0805e; --glass1:rgba(40,78,82,.78);--glass2:rgba(18,48,52,.62);--hi:rgba(255,255,255,.08);--well:rgba(212,236,234,.07);--sel:#2a5559;--ring:#7fd3df; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 30% 15%,var(--bg1),var(--bg2));background-color:var(--bg2);color:var(--ink);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:2;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.name{font-weight:700;font-size:1.2rem;letter-spacing:.06em;margin:0;white-space:nowrap}
.sub{font-size:.82rem;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums}
.sub b{color:var(--accent);font-size:1rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{pointer-events:auto;font:500 .85rem var(--f-body);color:var(--ink);background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 1px 0 var(--hi) inset,0 4px 12px -8px var(--shadow);transition:transform .15s,box-shadow .2s,background .2s,color .2s}
@media (hover:hover){button:hover{transform:translateY(-1px);box-shadow:0 1px 0 var(--hi) inset,0 8px 16px -10px var(--shadow)}}
button:active{transform:scale(.96)}
.ico{width:16px;height:16px;vertical-align:-3px;margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3;margin:0;max-width:min(92vw,26em);
  background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:.85rem;line-height:1.5;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:2;pointer-events:none;text-align:center;display:grid;gap:8px;justify-items:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .8s}
.panel.off{opacity:0;visibility:hidden}
.msg{margin:0;font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-wrap:balance}
.msg2{margin:0;font-size:.85rem;color:var(--ink-soft);line-height:1.6;text-wrap:balance;max-width:30em}
.tray{pointer-events:auto;display:grid;gap:10px;width:min(100%,560px);padding:12px 14px;border-radius:22px;
  background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 0 var(--hi) inset,0 18px 40px -24px var(--shadow)}
.sizes{display:flex;gap:10px;align-items:center;min-width:0}
.sizes>.opts{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:3px 2px;margin:-3px -2px;min-width:0;flex:1}
.sizes>.opts::-webkit-scrollbar{display:none}
.lab{flex:0 0 4.6em;text-align:left;font-size:.72rem;font-weight:700;color:var(--ink-soft);letter-spacing:.12em}
.pk{flex:1 0 auto;display:grid;justify-items:center;gap:3px;min-width:70px;padding:8px 8px 7px;border-radius:15px;font-size:.76rem;background:var(--well);border:1px solid transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.pk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.pk[aria-pressed="true"]{background:var(--sel);border-color:var(--ring);box-shadow:0 0 0 1px var(--ring),0 8px 16px -10px var(--shadow);font-weight:700}
.pk[aria-pressed="true"] svg{opacity:1;color:var(--ring)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--well);gap:2px}
.sz{min-width:58px;padding:6px 12px;border:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-soft)}
.sz small{font-weight:500;font-size:.7rem;margin-left:1px}
.sz[aria-pressed="true"]{background:var(--sel);color:var(--ink);box-shadow:0 1px 0 var(--hi) inset,0 3px 8px -4px var(--shadow)}
.sk{flex:0 0 auto;display:grid;justify-items:center;gap:4px;padding:2px 3px;border:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:.68rem;color:var(--ink-soft);min-width:48px}
.sk i,.mb{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset -3px -4px 6px rgba(0,0,0,.28),inset 2px 2px 4px rgba(255,255,255,.35),0 3px 6px -2px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.sk[aria-pressed="true"]{color:var(--ink);font-weight:700}
.sk[aria-pressed="true"] i{transform:translateY(-2px) scale(1.06);box-shadow:inset -3px -4px 6px rgba(0,0,0,.28),inset 2px 2px 4px rgba(255,255,255,.35),0 0 0 2px var(--sel),0 0 0 4px var(--ring),0 6px 10px -3px rgba(0,0,0,.35)}
.pk:hover,.sz:hover,.sk:hover,.dock button:hover{transform:none}
.sk:hover,.dock button:not(.on):hover{box-shadow:none}
.pk{flex:1 1 0}
@media (max-width:520px){
  .tray{gap:8px;padding:10px 12px 12px}
  .sizes{flex-direction:column;align-items:stretch;gap:4px}
  .lab{flex:none;font-size:.66rem;padding-left:4px}
  .pk{min-width:0;padding:7px 4px 6px;font-size:.7rem;letter-spacing:-.02em}
  .pk svg{width:22px;height:22px}
  .sizes>.opts{gap:6px}
  .sk{min-width:42px;font-size:.64rem}
  .sk i{width:27px;height:27px}
  .seg{width:100%}.sz{flex:1}
  .msg{font-size:.98rem}.msg2{font-size:.8rem}}
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:2;display:flex;gap:6px;padding:6px;border-radius:999px;
  background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--hi) inset,0 14px 30px -18px var(--shadow)}
.dock button{display:flex;align-items:center;gap:6px;border:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:8px 14px;font-weight:700;white-space:nowrap}
.dock button .ico{margin:0}
.dock button.on{background:var(--sel);box-shadow:0 1px 0 var(--hi) inset,0 3px 8px -4px var(--shadow)}
.dock .mb{width:20px;height:20px}
.rl{position:absolute;left:0;top:0;display:grid;gap:1px;justify-items:center;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.88);color:#23444a;
  border:1px solid rgba(35,68,74,.16);font:700 .82rem var(--f-body);white-space:nowrap;box-shadow:0 2px 8px rgba(18,66,72,.18);will-change:transform}
.rl small{font-weight:500;font-size:.7rem;color:#587a7d}
.rl.done{background:rgba(255,255,255,.7)}
#globe{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}#labels .rl{pointer-events:auto}
</style>

<canvas id="c" aria-label="絵が映った水玉。つまんでちぎり、もとの場所へもどすジグソーパズル"></canvas>
<canvas id="globe" aria-hidden="true"></canvas>
<div id="labels" hidden></div>
<header class="top" id="top">
  <div>
    <h1 class="name">みずたまジグソー</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="btns">
    <button id="scatter" type="button">ちらす</button>
    <button id="motion" type="button">ゆらす</button>
    <button id="restart" type="button" hidden>はじめから</button>
    <button id="back" type="button" hidden>池へもどる</button>
    <button id="shape" type="button" hidden>四角く見る</button>
    <button id="pondReset" type="button" hidden>ぜんぶくもらせる</button>
    <button id="snd" type="button" aria-pressed="true">音 オン</button>
  </div>
</header>
<p class="toast" id="toast" role="status" hidden></p>
<div class="panel" id="panel">
  <p class="msg" id="msg"></p>
  <p class="msg2" id="msg2"></p>
  <div class="tray">
  <div class="sizes" role="group" aria-label="絵">
    <span class="lab">絵</span>
    <div class="opts">
    <button class="pk" type="button" id="pk-pond" data-k="pond"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c3-5 9-6 13-2l4-3v10l-4-3c-4 4-10 3-13-2z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/></svg>金魚の池</button>
    <button class="pk" type="button" id="pk-globe" data-k="globe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>地球の海</button>
    <button class="pk" type="button" id="pk-magnet" data-k="magnet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 4h3v3H6zM15 4h3v3h-3z" fill="currentColor"/></svg>砂鉄と磁石</button>
    <button class="pk" type="button" id="pk-marble" data-k="marble"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12c2-3 6-2 6 1M12 12c-3 1-3 5 0 6M12 12c1-3-2-6-5-4"/><circle cx="8.5" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>ビー玉</button>
    </div>
  </div>
  <div class="sizes" id="skinRow" role="group" aria-label="きせかえ" hidden>
    <span class="lab">きせかえ</span>
    <div class="opts" id="skinOpts"></div>
  </div>
  <div class="sizes" role="group" aria-label="ピースの数">
    <span class="lab" id="lab">ピース</span>
    <div class="opts"><div class="seg">
    <button class="sz" type="button" id="sz7" data-n="7">7<small>こ</small></button>
    <button class="sz" type="button" id="sz19" data-n="19">19<small>こ</small></button>
    <button class="sz" type="button" id="sz37" data-n="37">37<small>こ</small></button>
    </div></div>
  </div>
  </div>
</div>
<div class="dock" id="dock" hidden>
  <button type="button" id="refBtn" aria-label="見本（おしているあいだ）"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>見本</button>
  <button type="button" id="hintBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="3.5"/></svg>ヒント</button>
  <button type="button" id="skinDock"><i class="mb" id="skinDot"></i>きせかえ</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PS=560,PC=280,BR0=200,SIZES=[7,19,37];
let W=0,H=0,DPR=1,BX=0,BY=0,R=150,HB=70;
const pic=document.createElement('canvas'),pg=pic.getContext('2d');
let C={};
function readColors(){const s=getComputedStyle(document.documentElement);
  for(const k of['dot','shadow','ghost','tint','ink'])C[k]=s.getPropertyValue('--'+k).trim();}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let nPieces=7;try{const v=+localStorage.getItem('mizutama-jigsaw-n');if(SIZES.includes(v))nPieces=v}catch(e){}
let doneCount=0;try{doneCount=+localStorage.getItem('mizutama-jigsaw-done')||0}catch(e){}

// ---------- audio ----------
let ac=null,soundOn=true;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state!=='running'){try{ac.resume()}catch(e){}}return ac}
function bloop(f0,f1,dur,vol,delay=0,type='sine'){if(!soundOn)return;const a=audio();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.7);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.03);}
const NOTES=[523,587,659,784,880,1047,1175,1319,1568];
const sGrab=()=>bloop(800,1200,0.05,0.08);
const sTear=()=>{bloop(1100,1900,0.06,0.13);bloop(600,1300,0.08,0.08,0.055)};
const sMerge=i=>{const f=NOTES[i%NOTES.length];bloop(f*0.55,f,0.16,0.15)};
const sBack=()=>bloop(420,760,0.12,0.12);
const sThud=()=>bloop(230,160,0.12,0.12);
const sWater=()=>bloop(900+Math.random()*500,1700,0.07,0.06);
const sDone=()=>{[0,2,4,5,7].forEach((n,i)=>bloop(NOTES[n]*0.9,NOTES[n],0.4,0.1,i*0.09))};
const sClick=()=>{bloop(2100,2600,0.03,0.11,0,'triangle');bloop(950,700,0.06,0.09,0.015,'triangle')};
const sRepel=()=>{bloop(150,95,0.2,0.1,0,'triangle');bloop(240,170,0.12,0.05,0.05)};
const sSand=()=>{for(let i=0;i<8;i++)bloop(1800+Math.random()*2600,1100+Math.random()*1400,0.04,0.03,i*0.035,'triangle');bloop(300,700,0.15,0.08)};
const sFish=()=>{bloop(500,1500,0.08,0.1);bloop(700,1800,0.07,0.06,0.07)};
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;sndBtn.textContent=soundOn?'音 オン':'音 オフ';sndBtn.setAttribute('aria-pressed',soundOn);if(soundOn)sGrab()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running'){try{ac.resume()}catch(e){}}});

// ---------- wobble (modal) ----------
const OM=[15,22,29],ZE=0.085;
const mk=()=>({m:new Float32Array(6),mv:new Float32Array(6)});
function modal(o,dt){for(let n=0;n<3;n++){const w=OM[n];for(let j=0;j<2;j++){const i=n*2+j;
  o.mv[i]+=(-w*w*o.m[i]-2*ZE*w*o.mv[i])*dt;o.m[i]+=o.mv[i]*dt;o.m[i]=Math.max(-0.4,Math.min(0.4,o.m[i]))}}}
function kick(o,ang,s,n=2){const i=(n-2)*2;o.mv[i]+=s*Math.cos(n*ang);o.mv[i+1]+=s*Math.sin(n*ang);}
function jiggle(o,s){if(reduce)s*=0.4;kick(o,Math.random()*6.28,s,2);kick(o,Math.random()*6.28,s*0.6,3);kick(o,Math.random()*6.28,s*0.4,4);}
function shapePath(m,r){const K=30,p=[];
  for(let i=0;i<K;i++){const t=i/K*6.2832,q=r*(1+m[0]*Math.cos(2*t)+m[1]*Math.sin(2*t)+m[2]*Math.cos(3*t)+m[3]*Math.sin(3*t)+m[4]*Math.cos(4*t)+m[5]*Math.sin(4*t));p.push([Math.cos(t)*q,Math.sin(t)*q])}
  ctx.beginPath();const mid=i=>{const a=p[i%K],b=p[(i+1)%K];return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
  let s=mid(0);ctx.moveTo(s[0],s[1]);for(let i=1;i<=K;i++){const a=p[i%K],q=mid(i);ctx.quadraticCurveTo(a[0],a[1],q[0],q[1])}ctx.closePath();}

// ---------- pictures ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
let live=false,liveAt=0;
const picRip=[];
function stepRip(dt){for(let i=picRip.length-1;i>=0;i--){picRip[i].t+=dt;if(picRip[i].t>1.6)picRip.splice(i,1)}}
function drawRip(g,col){for(const r of picRip){const k=r.t/1.6;g.strokeStyle=col.replace('A',(0.55*(1-k)).toFixed(3));g.lineWidth=2.5*(1-k)+0.5;
  g.beginPath();g.arc(r.x,r.y,8+r.t*70,0,6.283);g.stroke();if(r.t>0.25){g.beginPath();g.arc(r.x,r.y,8+(r.t-0.25)*55,0,6.283);g.stroke()}}}

/* ===== 金魚の池 ===== */
const FT={
  wakin:{b1:'#d4401d',b2:'#f38a4a',tail:'#f06c38',ta:.78,ray:'#ffd2b8',fin:'#b0301a'},
  sarasa:{b1:'#eedccd',b2:'#fffaf4',tail:'#f7cdbb',ta:.72,ray:'#ffffff',fin:'#d9a896'},
  demekin:{b1:'#1d1d25',b2:'#403e4d',tail:'#2e2d3a',ta:.72,ray:'#6a6878',fin:'#0d0d12'}};
function drawFish(g,f){
  const T=FT[f.ty],sw=Math.sin(f.ph);
  g.save();g.translate(f.x,f.y);g.rotate(f.a);g.scale(f.s,f.s);
  g.save();g.translate(-19,0);g.rotate(sw*0.32);g.globalAlpha=T.ta;g.fillStyle=T.tail;
  g.beginPath();g.moveTo(2,0);g.quadraticCurveTo(-12,-20+sw*3,-32,-18+sw*4);g.quadraticCurveTo(-21,-6,-26,sw*2);
  g.quadraticCurveTo(-21,6,-32,18+sw*4);g.quadraticCurveTo(-12,20+sw*3,2,0);g.fill();
  g.globalAlpha=T.ta*0.5;g.strokeStyle=T.ray;g.lineWidth=0.8;
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(0,0);g.lineTo(-27,i*7+sw*3);g.stroke()}
  g.restore();
  g.globalAlpha=T.ta;g.fillStyle=T.tail;
  for(const s of[-1,1]){g.save();g.translate(7,s*8);g.rotate(s*(0.9+Math.sin(f.ph*1.3)*0.2));g.beginPath();g.ellipse(-5,0,7,3.2,0,0,6.283);g.fill();g.restore()}

function front(p){const i=order.indexOf(p);if(i>=0){order.splice(i,1);order.push(p)}}
function homeCount(){return pieces.filter(p=>p.torn&&p.state==='home').length}
function neighborsJiggle(p,s){const pr=prOf(p);for(const q of pieces)if(q!==p&&q.state==='home'&&Math.hypot(q.sx-p.sx,q.sy-p.sy)*R/BR0<pr*2.4)jiggle(q,s)}
function detach(p,a){p.state='held';p.torn=true;p.mx=p.my=0;p.ox=p.x-p.fx;p.oy=p.y-p.fy;p.vx=p.vy=0;
  kick(p,a,-3);jiggle(p,1.1);sTear();const q=slotPos(p);screenRip.push({x:q.x,y:q.y,t:0,s:0.7});
  neighborsJiggle(p,0.9);jiggle(board,0.5);checkStage();}
function arrive(p){p.state='home';p.vx=p.vy=0;jiggle(p,1.3);neighborsJiggle(p,0.8);jiggle(board,0.3);
  const q=slotPos(p);screenRip.push({x:q.x,y:q.y,t:0,s:0.6});
  if(stage==='whole')sBack();else sMerge(homeCount()-1);if(SC.marble)sClink(0.8);
  updUI();checkDone();}
function checkStage(){if(stage==='whole'&&pieces.every(p=>p.torn)){stage='play';updUI()}}
function checkDone(){if(stage==='play'&&pieces.every(p=>p.state==='home')){finish()}}
let panelTimer=null;
function finish(){stage='done';live=true;liveAt=time+0.9;SC.start();
  if(picKey in PLANETS){PL.done[curReg]=1;PL.save();frozenReg=-1}
  jiggle(board,2.6);kick(board,-Math.PI/2,-2.5);sDone();
  doneCount++;try{localStorage.setItem('mizutama-jigsaw-done',doneCount)}catch(e){}
  updUI();clearTimeout(panelTimer);panelTimer=setTimeout(()=>{if(stage==='done')document.getElementById('panel').classList.remove('off')},1600);}

function targets(list){const out=[],pr=list.length?prOf(list[0])*0.66:30;
  for(const p of list){let best=null,bd=-1;
    for(let k=0;k<24;k++){const x=rnd(pr*0.7,W-pr*0.7),y=rnd(HB+pr*1.1,BOTY()-pr*0.9);
      if(Math.hypot(x-BX,y-BY)<R+pr*0.6)continue;
      let md=1e9;for(const o of out)md=Math.min(md,Math.hypot(o.x-x,o.y-y));
      for(const q of pieces)if(q.state==='free')md=Math.min(md,Math.hypot(q.x-x,q.y-y));
      if(md>bd){bd=md;best={x,y}}}
    out.push(best||{x:rnd(pr,W-pr),y:H-pr})}
  return out}
function scatter(){const list=pieces.filter(p=>p.state==='home'&&!p.torn).sort((a,b)=>Math.hypot(b.sx,b.sy)-Math.hypot(a.sx,a.sy));
  const ts=targets(list);list.forEach((p,i)=>{p.state='fly';p.torn=true;p.wait=i*0.06;p.tx=ts[i].x;p.ty=ts[i].y;p.started=false;front(p)});
  checkStage();}

// ---------- layout ----------
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  HB=document.getElementById('top').getBoundingClientRect().bottom+6;
  if(W>H*1.15){R=Math.min((H-HB)*0.44,W*0.26,220);BX=Math.max(R+24,W*0.3);BY=HB+(H-HB)/2}
  else{R=Math.min(W*0.42,(H-HB)*0.3,210);BX=W/2;BY=HB+R+10}
  renderPic(time);
  for(const p of pieces)if(p.state==='home'){const q=slotPos(p);p.x=q.x;p.y=q.y}
  if(view==='map')mapFit(false);
}
addEventListener('resize',()=>{layout()});


// ---------- magnets (砂鉄と磁石の絵のとき) ----------
let lastMagSnd=0,lastClk=0,lastClinkT=0;
let hintP=null,hintT=0,refHold=false,refA=0;
const dockOn=()=>picKey==='marble'&&view==='puzzle'&&stage==='play';
const BOTY=()=>H-(dockOn()?76:0);
function giveHint(){let p=pieces.find(q=>q.state==='held');
  if(!p){const fr=pieces.filter(q=>q.state==='free'||q.state==='fly');if(!fr.length){toast('いまは、ちらばっている水玉がありません');return}
    const avoid=hintP;p=fr.filter(q=>q!==avoid)[(Math.random()*Math.max(1,fr.length-1))|0]||fr[0]}
  hintP=p;hintT=3.4;jiggle(p,1.2);if(p.state!=='held')front(p);
  [0,2,4].forEach((n,i)=>bloop(MNOTE[n]*2,MNOTE[n]*2.02,0.25,0.05,i*0.08,'triangle'))}
function drawHint(){if(hintT<=0||!hintP||hintP.state==='home'||hintP.state==='settle'){hintT=0;return}
  const p=hintP,q=slotPos(p),pr=prOf(p),a=Math.min(1,hintT/0.6)*Math.min(1,(3.4-hintT)*4),pl=0.5+0.5*Math.sin(time*7);
  ctx.save();ctx.globalAlpha=a;
  const mx=(p.x+q.x)/2,my=(p.y+q.y)/2,dx=q.x-p.x,dy=q.y-p.y,cx=mx-dy*0.18,cy=my+dx*0.18;
  ctx.setLineDash([2,10]);ctx.lineDashOffset=-time*40;ctx.lineCap='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.shadowColor='rgba(255,240,180,.9)';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(cx,cy,q.x,q.y);ctx.stroke();ctx.setLineDash([]);
  for(const [x,y,r,w] of [[q.x,q.y,pr*(1.02+0.1*pl),3],[p.x,p.y,pr*zOf(p)*(1.08+0.08*pl),2.5]]){ctx.lineWidth=w;ctx.strokeStyle=`rgba(255,236,150,${0.6+0.4*pl})`;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.stroke()}
  const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,pr);g.addColorStop(0,`rgba(255,246,200,${0.35+0.2*pl})`);g.addColorStop(1,'rgba(255,246,200,0)');ctx.fillStyle=g;ctx.shadowBlur=0;ctx.fillRect(q.x-pr,q.y-pr,pr*2,pr*2);
  for(let k=0;k<6;k++){const t=time*1.6+k*1.047,x=p.x+Math.cos(t)*pr*1.25,y=p.y+Math.sin(t)*pr*1.25,s=2+1.5*Math.sin(time*9+k);ctx.fillStyle='rgba(255,250,220,.95)';ctx.beginPath();ctx.moveTo(x,y-s*2);ctx.lineTo(x+s*0.6,y);ctx.lineTo(x,y+s*2);ctx.lineTo(x-s*0.6,y);ctx.closePath();ctx.fill()}
  ctx.restore()}
function buzz(p,a){if(time-(p.bz||0)>0.32){p.bz=time;jiggle(p,0.9);kick(p,a,-1.6)}if(time-lastMagSnd>0.28){lastMagSnd=time;sRepel()}}
function clack(a,b){jiggle(a,0.7);jiggle(b,0.7);if(time-lastClk>0.08){lastClk=time;sClick()}}
function autoSnap(p){for(const [id,q] of grabs)if(q===p)grabs.delete(id);p.state='settle';p.vx*=0.3;p.vy*=0.3;p.mx=p.my=0;sClick()}
function magnetStep(dt){
  if(!SC.magnetic||stage==='done')return;
  const sc=R/BR0,act=pieces.filter(p=>p.state==='free'||p.state==='held');
  for(const p of act){const pr=p.r*sc,own=slotPos(p);let tx=0,ty=0,ax=0,ay=0;
    const dx=own.x-p.x,dy=own.y-p.y,d=Math.hypot(dx,dy)||1e-3,rng=pr*2.2;
    if(d<rng){const k=1-d/rng;
      if(p.state==='held'){const m=Math.min(d,pr*0.85)*k*1.4;tx+=dx/d*m;ty+=dy/d*m;if(d<pr*0.45){autoSnap(p);continue}}
      else{ax+=dx/d*(500+2400*k);ay+=dy/d*(500+2400*k);if(d<pr*0.35&&Math.hypot(p.vx,p.vy)<260){p.state='settle';sClick();continue}}}
    for(const q of pieces){if(q===p||q.state!=='home'||q.pol!==p.pol)continue;
      const s=slotPos(q),ex=p.x-s.x,ey=p.y-s.y,e=Math.hypot(ex,ey)||1e-3,rr=pr*1.35;
      if(e<rr){const k=1-e/rr;if(p.state==='held'){tx+=ex/e*pr*0.6*k;ty+=ey/e*pr*0.6*k}else{ax+=ex/e*2800*k;ay+=ey/e*2800*k}
        if(k>0.3)buzz(p,Math.atan2(ey,ex))}}
    if(p.state==='held'){const kk=Math.min(1,dt*10);p.mx+=(tx-p.mx)*kk;p.my+=(ty-p.my)*kk}else{p.vx+=ax*dt;p.vy+=ay*dt}}
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){const a=act[i],b=act[j];
    const fa=a.state==='free',fb=b.state==='free';if(!fa&&!fb)continue;if(!(fa||a.state==='held')||!(fb||b.state==='held'))continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-3,cd=(prOf(a)+prOf(b))*0.66*0.85,rng=cd*2.4;if(d>rng)continue;
    const same=a.pol===b.pol,mag=Math.min(4000,2400*(cd/d)**2)*(1-d/rng)*(same?-1:1),fx=dx/d*mag,fy=dy/d*mag;
    if(fa){a.vx+=fx*dt;a.vy+=fy*dt}if(fb){b.vx-=fx*dt;b.vy-=fy*dt}
    if(d<cd&&!(fa&&fb)){const o=cd-d;if(fa){a.x-=dx/d*o;a.y-=dy/d*o}else{b.x+=dx/d*o;b.y+=dy/d*o}}
    if(!same&&d<cd*1.1){const cl=-((b.vx-a.vx)*dx+(b.vy-a.vy)*dy)/d;
      if(cl>70){if(fa&&fb){const mx=(a.vx+b.vx)/2,my=(a.vy+b.vy)/2;a.vx=b.vx=mx;a.vy=b.vy=my}else if(fa){a.vx*=0.3;a.vy*=0.3}else{b.vx*=0.3;b.vy*=0.3}clack(a,b)}}
    if(same&&d<cd*1.4&&!(fa&&fb)){const f=fa?a:b,o=fa?b:a;buzz(f,Math.atan2(f.y-o.y,f.x-o.x))}}
}

// ---------- update ----------
function update(dt){
  time+=dt;flushMotion();hintT=Math.max(0,hintT-dt);refA+=((refHold&&stage!=='done'?1:0)-refA)*Math.min(1,dt*10);
  if(view==='map'){PL.world.update(dt);camStep(dt);for(let i=screenRip.length-1;i>=0;i--){screenRip[i].t+=dt;if(screenRip[i].t>1.4)screenRip.splice(i,1)}return}
  modal(board,dt);magnetStep(dt);
  const sc=R/BR0;
  for(const p of pieces){const tg=slotPos(p),pr=p.r*sc;
    switch(p.state){
    case 'pull':{const vx=p.fx-tg.x,vy=p.fy-tg.y,len=Math.hypot(vx,vy)||1e-6,k=Math.min(len*0.42,pr*0.5);
      p.x=tg.x+vx/len*k;p.y=tg.y+vy/len*k;const e=Math.min(0.3,len/pr*0.26),a=Math.atan2(vy,vx);
      p.m.fill(0);p.mv.fill(0);p.m[0]=e*Math.cos(2*a);p.m[1]=e*Math.sin(2*a);
      if(len>pr*1.15)detach(p,a);break}
    case 'held':{const d=Math.exp(-dt*7);p.ox*=d;p.oy*=d;const tx=p.fx+p.ox+p.mx,ty=p.fy+p.oy+p.my,kk=Math.min(1,dt*22);
      const nx=p.x+(tx-p.x)*kk,ny=p.y+(ty-p.y)*kk,vx=(nx-p.x)/dt,vy=(ny-p.y)/dt,ax=(vx-p.vx)/dt,ay=(vy-p.vy)/dt;
      p.vx=vx;p.vy=vy;p.x=nx;p.y=ny;if(SC.marble){const w=((p.rot+Math.PI)%TAU+TAU)%TAU-Math.PI;p.rot-=w*Math.min(1,dt*9)}const am=Math.hypot(ax,ay);if(am>500)kick(p,Math.atan2(ay,ax),Math.min(am,30000)*0.00032*dt);break}
    case 'fly':if(p.wait>0){p.wait-=dt;break}
      if(!p.started){p.started=true;sTear();neighborsJiggle(p,0.6);screenRip.push({x:p.x,y:p.y,t:0,s:0.5})}
      /* falls through */
    case 'settle':{const T=p.state==='fly'?{x:p.tx,y:p.ty}:tg,ax=(T.x-p.x)*150-p.vx*15,ay=(T.y-p.y)*150-p.vy*15;
      p.vx+=ax*dt;p.vy+=ay*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const am=Math.hypot(ax,ay);
      if(am>300)kick(p,Math.atan2(ay,ax),Math.min(am,40000)*0.0004*dt);
      if(Math.hypot(T.x-p.x,T.y-p.y)<2&&Math.hypot(p.vx,p.vy)<40){if(p.state==='fly'){p.state='free';p.vx=p.vy=0;jiggle(p,1)}else arrive(p)}break}
    case 'free':{const mar=SC.marble,d=Math.exp(-dt*(mar?0.7:2.8)),bo=mar?0.82:0.5;p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;
      const m=pr*zOf(p)*0.55,sp0=Math.hypot(p.vx,p.vy);let hit=false;
      if(p.x<m){p.x=m;p.vx=Math.abs(p.vx)*bo;hit=true}if(p.x>W-m){p.x=W-m;p.vx=-Math.abs(p.vx)*bo;hit=true}
      if(p.y<HB*0.6){p.y=HB*0.6;p.vy=Math.abs(p.vy)*bo;hit=true}if(p.y>BOTY()-m){p.y=BOTY()-m;p.vy=-Math.abs(p.vy)*bo;hit=true}
      if(mar){p.rot+=(p.vx>=0?1:-1)*sp0*dt/(pr*0.9);if(hit&&sp0>80){sClink(Math.min(0.8,sp0/600));jiggle(p,0.4)}}break}
    case 'home':p.x=tg.x;p.y=tg.y;break}
    if(p.state!=='pull')modal(p,dt);
    p.clr=(p.clr||0)+(((p.state==='held'||(p===hintP&&hintT>0))&&SC.marble?1:0)-(p.clr||0))*Math.min(1,dt*8);
    const want=p.state==='home'?1:0;p.h+=(want-p.h)*Math.min(1,dt*(want?4:10));p.L=1+0.07*(1-p.h);
  }
  // a held marble knocks loose marbles
  if(SC.marble)for(const h of pieces){if(h.state!=='held')continue;for(const q of pieces){if(q.state!=='free')continue;const dx=q.x-h.x,dy=q.y-h.y,d=Math.hypot(dx,dy)||1e-3,min=(prOf(h)+prOf(q))*0.66*0.85;
    if(d<min){const nx=dx/d,ny=dy/d;q.x=h.x+nx*min;q.y=h.y+ny*min;const rv=(q.vx-h.vx)*nx+(q.vy-h.vy)*ny;if(rv<0){q.vx-=nx*rv*1.6;q.vy-=ny*rv*1.6;if(-rv>60&&time-lastClinkT>0.04){lastClinkT=time;sClink(Math.min(1,-rv/500))}}}}}
  // free drops push each other gently
  const fr=pieces.filter(p=>p.state==='free');
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length;j++){const a=fr[i],b=fr[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-3,min=(prOf(a)+prOf(b))*0.66*0.85;
    if(SC.marble&&d<min*1.02){const nx=dx/d,ny=dy/d,rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){a.vx+=nx*rv*0.92;a.vy+=ny*rv*0.92;b.vx-=nx*rv*0.92;b.vy-=ny*rv*0.92;if(-rv>40&&time-lastClinkT>0.04){lastClinkT=time;sClink(Math.min(1,-rv/400))}}}
    if(d<min){const push=(min-d)*0.5*Math.min(1,dt*8);a.x-=dx/d*push;a.y-=dy/d*push;b.x+=dx/d*push;b.y+=dy/d*push;if(min-d>6&&Math.random()<dt*3){jiggle(a,0.3);jiggle(b,0.3)}}}
  for(let i=screenRip.length-1;i>=0;i--){screenRip[i].t+=dt;if(screenRip[i].t>1.4)screenRip.splice(i,1)}
  if(live){SC.update(dt);renderPic(time)}
}

// ---------- drawing ----------
function dots(){const g=26;ctx.fillStyle=C.dot;ctx.beginPath();
  for(let y=g/2;y<H;y+=g)for(let x=g/2;x<W;x+=g){ctx.moveTo(x+1.6,y);ctx.arc(x,y,1.6,0,6.283)}ctx.fill();}
function drawPiece(p){
  const sc=R/BR0,h=p.h,z=zOf(p),pr=p.r*sc*z,soft=h<0.985;
  ctx.save();ctx.translate(p.x,p.y);
  if(soft){ctx.save();ctx.translate(pr*0.16,pr*0.3);ctx.scale(1,0.86);ctx.globalAlpha=0.4*(1-h);ctx.fillStyle=C.shadow;shapePath(p.m,pr*0.97);ctx.fill();ctx.restore()}
  ctx.save();shapePath(p.m,pr);ctx.clip();
  const s=p.L*sc*z,mb=SC.marble?1-h:0,cl=p.clr||0;ctx.save();if(mb){ctx.rotate(p.rot*mb);ctx.scale(1+0.22*mb*(1-cl),1+0.22*mb*(1-cl))}ctx.scale(s,s);ctx.translate(-(PC+p.sx),-(PC+p.sy));ctx.drawImage(pic,0,0,PS,PS);ctx.restore();
  if(soft){const a=1-h;
    ctx.globalAlpha=0.16*a;ctx.fillStyle=C.tint;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);
    ctx.globalAlpha=a;
    let g=ctx.createRadialGradient(-pr*0.38,-pr*0.42,pr*0.04,-pr*0.2,-pr*0.25,pr*0.85);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(0.35,'rgba(255,255,255,.14)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);
    g=ctx.createRadialGradient(pr*0.1,pr*0.12,pr*0.5,0,0,pr*1.08);g.addColorStop(0,'rgba(8,48,58,0)');g.addColorStop(1,'rgba(8,48,58,.38)');
    ctx.fillStyle=g;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3)}
  if(soft&&SC.marble){const a=(1-h)*(1-0.72*cl),col=MCOLS[p.mc];ctx.globalAlpha=0.1*a;ctx.fillStyle=col;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);
    ctx.globalAlpha=0.22*a;ctx.save();ctx.rotate(p.rot);ctx.fillStyle=col;for(let k=0;k<3;k++){ctx.rotate(TAU/3);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(pr*0.5,-pr*0.25,pr*0.75,pr*0.15,pr*0.2,pr*0.55);ctx.bezierCurveTo(pr*0.35,pr*0.1,pr*0.2,-pr*0.05,0,0);ctx.fill()}ctx.restore();
    ctx.globalAlpha=a;let g2=ctx.createRadialGradient(0,0,pr*0.55,0,0,pr*1.02);g2.addColorStop(0,'rgba(0,0,20,0)');g2.addColorStop(1,'rgba(0,0,20,.5)');ctx.fillStyle=g2;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);
    g2=ctx.createRadialGradient(-pr*0.38,-pr*0.42,0,-pr*0.38,-pr*0.42,pr*0.4);g2.addColorStop(0,'rgba(255,255,255,.95)');g2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g2;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);
    g2=ctx.createRadialGradient(pr*0.35,pr*0.42,0,pr*0.35,pr*0.42,pr*0.45);g2.addColorStop(0,'rgba(255,255,255,.4)');g2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g2;ctx.fillRect(-pr*1.5,-pr*1.5,pr*3,pr*3);ctx.globalAlpha=1}
  ctx.restore();
  if(soft){ctx.globalAlpha=0.8*(1-h);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.5;shapePath(p.m,pr);ctx.stroke()}
  if(soft&&p.pol&&SC.magnetic){const col=p.pol>0?NCOL:SCOL;ctx.globalAlpha=1-h;ctx.strokeStyle=col;ctx.lineWidth=3.2;shapePath(p.m,pr*0.96);ctx.stroke();
    const br=Math.max(8,pr*0.2),bx=pr*0.52,by=pr*0.52;ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(bx,by,br,0,6.283);ctx.fill();
    ctx.fillStyle=col;ctx.font=`700 ${Math.round(br*1.25)}px "Zen Maru Gothic",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.pol>0?'N':'S',bx,by+1)}
  ctx.restore();
}
function drawBoard(){
  const sc=R/BR0,br=1+(reduce?0:0.006*Math.sin(time*1.4));
  ctx.save();ctx.translate(BX+R*0.05,BY+R*0.1);ctx.scale(1,0.92);ctx.globalAlpha=0.3;ctx.fillStyle=C.shadow;shapePath(board.m,R*br);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(BX,BY);shapePath(board.m,R*br);ctx.clip();ctx.translate(-BX,-BY);
  const ox=BX-PC*sc,oy=BY-PC*sc,sz=PS*sc;
  if(stage==='done'){ctx.drawImage(pic,ox,oy,sz,sz)}
  else{
    ctx.globalAlpha=0.3;ctx.drawImage(pic,ox,oy,sz,sz);ctx.globalAlpha=0.4;ctx.fillStyle=C.ghost;ctx.fillRect(BX-R*1.2,BY-R*1.2,R*2.4,R*2.4);ctx.globalAlpha=1;
    for(const p of order)if(p.state==='home')drawPiece(p);
    for(const p of pieces)if(p.state==='held'){const q=slotPos(p),pr=prOf(p),d=Math.hypot(p.x-q.x,p.y-q.y);
      if(SC.marble&&d<pr*3.2&&d>=pr*1.1){const k=1-d/(pr*3.2);ctx.globalAlpha=k*0.8;ctx.strokeStyle='rgba(255,246,200,.9)';ctx.lineWidth=2+2*k;ctx.beginPath();ctx.arc(q.x,q.y,pr*(1+0.06*Math.sin(time*8)),0,6.283);ctx.stroke();ctx.globalAlpha=1}
      if(d<pr*1.1){const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,pr);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.globalAlpha=1-d/(pr*1.1);ctx.fillStyle=g;ctx.fillRect(q.x-pr,q.y-pr,pr*2,pr*2);ctx.globalAlpha=1}}
    if(refA>0.01){ctx.globalAlpha=refA;ctx.drawImage(pic,ox,oy,sz,sz);ctx.globalAlpha=1}
  }
  let g=ctx.createRadialGradient(BX-R*0.42,BY-R*0.48,R*0.03,BX-R*0.25,BY-R*0.3,R*0.9);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(0.3,'rgba(255,255,255,.1)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(BX-R*1.2,BY-R*1.2,R*2.4,R*2.4);
  g=ctx.createRadialGradient(BX+R*0.08,BY+R*0.1,R*0.6,BX,BY,R*1.05);g.addColorStop(0,'rgba(8,48,58,0)');g.addColorStop(1,'rgba(8,48,58,.3)');
  ctx.fillStyle=g;ctx.fillRect(BX-R*1.2,BY-R*1.2,R*2.4,R*2.4);
  ctx.restore();
  ctx.save();ctx.translate(BX,BY);ctx.globalAlpha=0.85;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;shapePath(board.m,R*br);ctx.stroke();ctx.restore();
}
function draw(){
  {const gs=view==='map'&&GL()?'block':'none';if(gcv.style.display!==gs)gcv.style.display=gs;if(!(view==='map'&&GL()))labelsEl.hidden=true}
  if(view==='map'){drawMap();for(const r of screenRip){const k=r.t/1.4;ctx.globalAlpha=0.45*(1-k);ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(r.x,r.y,10+r.t*60*(r.s||1),0,6.283);ctx.stroke()}ctx.globalAlpha=1;return}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;
  dots();
  for(const r of screenRip){const k=r.t/1.4;ctx.globalAlpha=0.45*(1-k);ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(r.x,r.y,10+r.t*60*(r.s||1),0,6.283);ctx.stroke()}
  ctx.globalAlpha=1;drawBoard();
  for(const p of order)if(p.state!=='home')drawPiece(p);
  drawHint();
}
let last=performance.now();
function frame(now){const dt=Math.min(0.033,Math.max(0.001,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame)}

// ---------- shaking ----------
let lastShakeSnd=0,mAx=0,mAy=0,gotMotion=false,lgv=null;
function shake(ax,ay){const m=Math.hypot(ax,ay);if(m<60)return;const a=Math.atan2(ay,ax);
  if(view==='map'){{const c=GL()?(pickW(glb.cx,glb.cy)||{x:0,y:WH/2}):{x:(W/2-cam.ox)/cam.s,y:(H/2-cam.oy)/cam.s};PL.world.slosh(ax*0.35,ay*0.35,c.x,c.y)}if(time-lastShakeSnd>0.2&&m>200){lastShakeSnd=time;bloop(260+Math.random()*160,620+Math.random()*200,0.22,0.08)}return}
  kick(board,a,-Math.min(3,m/260));jiggle(board,Math.min(0.8,m/900));
  for(const p of pieces){if(p.state==='free'){p.vx+=ax*0.6;p.vy+=ay*0.6;jiggle(p,Math.min(1.4,m/450))}else if(p.state==='home')jiggle(p,Math.min(0.7,m/700))}
  if(stage==='done'&&SC.slosh)SC.slosh(ax*0.35,ay*0.35);
  if(time-lastShakeSnd>0.2&&m>200){lastShakeSnd=time;bloop(260+Math.random()*160,620+Math.random()*200,0.22,0.08);bloop(700,1300,0.08,0.04,0.06)}}
function onMotion(e){let x,y;const a=e.acceleration;
  if(a&&a.x!=null){x=a.x;y=a.y}else{const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;if(!lgv)lgv={x:g.x,y:g.y};lgv.x+=(g.x-lgv.x)*0.1;lgv.y+=(g.y-lgv.y)*0.1;x=g.x-lgv.x;y=g.y-lgv.y}
  if(!gotMotion){gotMotion=true;const b=document.getElementById('motion');if(b)b.hidden=true}
  const an=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;
  const sx=x*Math.cos(an)+y*Math.sin(an),sy=-(-x*Math.sin(an)+y*Math.cos(an));
  if(Math.hypot(sx,sy)>1.6){mAx-=sx*38;mAy-=sy*38}}
addEventListener('devicemotion',onMotion);
function flushMotion(){const m=Math.hypot(mAx,mAy);if(m>0){const k=m>900?900/m:1;shake(mAx*k,mAy*k);mAx=mAy=0}}
let toastT=null;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},5200)}
async function enableMotion(){audio();
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')throw 0}}
  catch(e){toast('スマホの動きを使えませんでした。池を指でさっとなでても、水がゆれます');return}
  removeEventListener('devicemotion',onMotion);addEventListener('devicemotion',onMotion);
  toast('スマホをゆらしてみてください');
  setTimeout(()=>{if(!gotMotion)toast('このページではスマホの動きを読めないようです。池を指でさっとなでても、水がゆれます')},2000)}
const motionBtn=document.getElementById('motion');
if(!(typeof DeviceMotionEvent!=='undefined'&&matchMedia('(pointer: coarse)').matches))motionBtn.hidden=true;
motionBtn.addEventListener('click',enableMotion);

// ---------- input ----------
const swipes=new Map();
const grabs=new Map();
function pointAt(e){return{x:e.clientX,y:e.clientY}}
cv.addEventListener('pointerdown',e=>{
  audio();const {x,y}=pointAt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(view==='map'){mapPtr.set(e.pointerId,{sx:x,sy:y,lx:x,ly:y,lt:performance.now(),moved:false,ox0:cam.ox});cam.vx=0;glb.vlon=glb.vlat=0;glb.idle=0;return}
  if(stage==='done'){
    if(Math.hypot(x-BX,y-BY)<R){const sc=R/BR0;SC.tap((x-BX)/sc+PC,(y-BY)/sc+PC);jiggle(board,0.5);swipes.set(e.pointerId,{x,y,t:performance.now(),last:0})}
    else{screenRip.push({x,y,t:0});sWater()}return}
  for(let i=order.length-1;i>=0;i--){const p=order[i];if(p.state!=='free'&&p.state!=='fly'&&p.state!=='settle')continue;
    if(Math.hypot(p.x-x,p.y-y)<prOf(p)*zOf(p)+10){p.state='held';p.mx=p.my=0;p.fx=x;p.fy=y;p.ox=p.x-x;p.oy=p.y-y;p.vx=p.vy=0;p.wait=0;p.torn=true;front(p);jiggle(p,0.8);sGrab();
      grabs.set(e.pointerId,p);checkStage();return}}
  if(Math.hypot(x-BX,y-BY)<R){let best=null,bd=1e9;
    for(const p of pieces){if(p.state!=='home')continue;const q=slotPos(p),d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=p}}
    if(best&&bd<prOf(best)){best.state='pull';best.fx=x;best.fy=y;front(best);sGrab();grabs.set(e.pointerId,best);return}}
  screenRip.push({x,y,t:0});sWater();
});
cv.addEventListener('pointermove',e=>{const mp=mapPtr.get(e.pointerId);
  if(mp){if(Math.abs(e.clientX-mp.sx)>7||Math.abs(e.clientY-mp.sy)>7)mp.moved=true;
    if(mp.moved)mapDrag(mp,e.clientX,e.clientY);return}
  const w=swipes.get(e.pointerId);
  if(w&&SC.drag){const sc=R/BR0;SC.drag((e.clientX-BX)/sc+PC,(e.clientY-BY)/sc+PC);return}
  if(w){const now=performance.now(),dt=Math.max(8,now-w.t)/1000,vx=(e.clientX-w.x)/dt,vy=(e.clientY-w.y)/dt;w.x=e.clientX;w.y=e.clientY;w.t=now;
    if(Math.hypot(vx,vy)>450&&now-w.last>70){w.last=now;const k=Math.min(1,900/Math.hypot(vx,vy));shake(vx*k*0.8,vy*k*0.8)}return}
  const p=grabs.get(e.pointerId);if(!p)return;const {x,y}=pointAt(e);p.fx=x;p.fy=y});
function release(e){const mp=mapPtr.get(e.pointerId);if(mp){mapPtr.delete(e.pointerId);if(e.type==='pointerup'&&!mp.moved)mapTap(e.clientX,e.clientY);if(performance.now()-mp.lt>90){cam.vx=0;glb.vlon=glb.vlat=0}return}
  if(swipes.has(e.pointerId)&&SC.lift)SC.lift();swipes.delete(e.pointerId);const p=grabs.get(e.pointerId);if(!p)return;grabs.delete(e.pointerId);
  if(p.state==='pull'){p.state='settle';p.vx=p.vy=0;return}
  if(p.state!=='held')return;
  const pr=prOf(p),q=slotPos(p),kf=SC.marble?0.9:0.45;p.vx*=kf;p.vy*=kf;
  if(Math.hypot(p.x-q.x,p.y-q.y)<pr*(SC.magnetic||SC.marble?1:0.7)){p.state='settle';if(SC.magnetic)sClick();return}
  p.state='free';
  for(const o of pieces){if(o===p||o.state==='home'||o.state==='settle')continue;const s=slotPos(o),d=Math.hypot(p.x-s.x,p.y-s.y);
    if(d<pr*0.55){const a=Math.atan2(p.y-s.y,p.x-s.x)+rnd(-.5,.5);p.vx=Math.cos(a)*300;p.vy=Math.sin(a)*300;jiggle(p,2.2);kick(p,a,-2.5);sThud();break}}
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

// ---------- UI ----------
const sub=document.getElementById('sub'),panel=document.getElementById('panel');
function updUI(){
  const bk=document.getElementById('back'),pr=document.getElementById('pondReset');
  {const mar=picKey==='marble';skinRow.hidden=!mar;skinOpts.querySelectorAll('.sk').forEach((b,i)=>b.setAttribute('aria-pressed',i===skinI));
   document.getElementById('dock').hidden=!(mar&&view==='puzzle'&&stage==='play');document.getElementById('skinDot').style.background=skinBg(MSKINS[skinI])}
  bk.hidden=!(picKey in PLANETS&&view==='puzzle');bk.textContent=picKey==='magnet'?'紙へもどる':picKey==='globe'?'地球へもどる':'池へもどる';pr.hidden=!(view==='map'&&PL.done.some(v=>v));{const sb=document.getElementById('shape');sb.hidden=!(view==='map'&&gl);sb.textContent=shape==='round'?'四角く見る':'まるく見る'}
  document.querySelectorAll('.sz').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===nPieces));
  document.querySelectorAll('.pk').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===picKey));
  if(view==='map'){document.getElementById('scatter').hidden=true;document.getElementById('restart').hidden=true;
    const k=PL.done.filter(v=>v).length,N=PL.done.length;sub.innerHTML=`そろった区画 <b>${k}</b> / ${N}`;
    document.getElementById('msg').textContent=(GL()?PL.title[k===N?1:0]:PL.title[k===N?1:0].replace('まるい','四角い'));
    document.getElementById('msg2').textContent=GL()?PL.msg[k===N?1:0]:PL.msg[k===N?1:0].replace(/^指で回すと、[^。]*。/,'横にすべらせると、ほかの区画も見わたせます。');
    panel.classList.remove('off');return}
  document.getElementById('scatter').hidden=stage!=='whole';
  document.getElementById('restart').hidden=stage!=='play';
  if(stage==='whole'){sub.innerHTML=`<b>${pieces.length}</b> この水玉にちぎれます`;
    document.getElementById('msg').textContent='水玉をつまんで、外へ引っぱってみてください';
    document.getElementById('msg2').textContent=picKey in PLANETS?`「${SC.label}」の水玉です。`+(SC.magnetic?'ふちが赤はN、青はS。ちがう色はくっつき、同じ色ははじきあいます。正しい場所に近づけると吸いこまれます':'もとの場所へもどすと、この区画が動きだします'):SC.magnetic?'ふちが赤はN、青はS。ちがう色どうしはくっつき、同じ色どうしははじきあいます。正しい場所に近づけると吸いこまれます':SC.marble?'ちぎれたビー玉は、はじくと転がってぶつかり合います。つまむとガラスがすきとおって中の絵が見えます。こまったら下の「ヒント」と「見本」をどうぞ':'ちぎれた水玉を、もとの場所へもどすと絵ができあがります';
panel.classList.remove('off')}
  else if(stage==='play'){sub.innerHTML=`もどった水玉 <b>${homeCount()}</b> / ${pieces.length}`;panel.classList.add('off')}
  else{sub.innerHTML=`できた絵 <b>${doneCount}</b> まい`;
    document.getElementById('msg').textContent=SC.done[0];
    document.getElementById('msg2').textContent=SC.done[1];panel.classList.add('off')}
  document.querySelectorAll('.sz').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===nPieces));
  document.querySelectorAll('.pk').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===picKey));
}
document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>{audio();
  if(view==='map'){nPieces=+b.dataset.n;try{localStorage.setItem('mizutama-jigsaw-n',nPieces)}catch(e){}updUI();sBack();return}
  build(+b.dataset.n);jiggle(board,1.2);sBack()}));
document.getElementById('back').addEventListener('click',()=>{audio();backToMap()});
const skinRow=document.getElementById('skinRow'),skinOpts=document.getElementById('skinOpts');
const skinBg=s=>`radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 24%),conic-gradient(from 20deg,${s.cols[0]},${s.cols[2]},${s.cols[4]},${s.cols[6]},${s.cols[1]},${s.cols[0]})`;
MSKINS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='sk';
  b.innerHTML=`<i style="background:${skinBg(s)}"></i>${s.name}`;
  b.addEventListener('click',()=>{audio();setSkin(i)});skinOpts.appendChild(b)});
function setSkin(i){skinI=i;MCOLS=MSKINS[i].cols;try{localStorage.setItem('mizutama-marble-skin',MSKINS[i].k)}catch(e){}
  renderPic(live?time:0);jiggle(board,0.8);for(const p of pieces)if(p.state!=='home')jiggle(p,0.5);sClink(0.8);updUI()}
document.getElementById('skinDock').addEventListener('click',()=>{audio();setSkin((skinI+1)%MSKINS.length);toast(`きせかえ：${MSKINS[skinI].name}`)});
const hintBtn=document.getElementById('hintBtn'),refBtn=document.getElementById('refBtn');
hintBtn.addEventListener('click',()=>{audio();giveHint()});
const refOn=e=>{e.preventDefault();audio();refHold=true;refBtn.classList.add('on');bloop(700,1100,0.12,0.05,0,'triangle')},refOff=()=>{refHold=false;refBtn.classList.remove('on')};
refBtn.addEventListener('pointerdown',refOn);for(const ev of['pointerup','pointercancel','pointerleave'])refBtn.addEventListener(ev,refOff);
refBtn.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')refOn(e)});refBtn.addEventListener('keyup',refOff);
document.getElementById('shape').addEventListener('click',()=>{audio();shape=shape==='round'?'flat':'round';try{localStorage.setItem('mizutama-shape',shape)}catch(e){}
  mapFit(true);updUI();sBack();toast(shape==='flat'?'四角い地図にしました。横にすべらせて見わたせます':'まるい球にもどしました。指で回せます')});
let resetArm=0;const prBtn=document.getElementById('pondReset');
prBtn.addEventListener('click',()=>{audio();if(performance.now()-resetArm>3000){resetArm=performance.now();prBtn.textContent='本当にくもらせる？';setTimeout(()=>{prBtn.textContent='ぜんぶくもらせる'},3000);return}
  PL.done.fill(0);PL.save();PL.announced=false;if(PL.world.unjoin)PL.world.unjoin();try{localStorage.removeItem(PL.allKey)}catch(e){}prBtn.textContent='ぜんぶくもらせる';updUI();toast('ぜんぶくもりました。また区画ごとにそろえられます')});
function choosePic(k){picKey=k;try{localStorage.setItem('mizutama-jigsaw-pic',picKey)}catch(e){}
  if(k in PLANETS){newScene();backToMap();return}
  view='puzzle';frozenReg=-1;build(nPieces);jiggle(board,1.4);sBack()}
document.querySelectorAll('.pk').forEach(b=>b.addEventListener('click',()=>{audio();choosePic(b.dataset.k)}));
document.getElementById('scatter').addEventListener('click',()=>{audio();scatter()});
document.getElementById('restart').addEventListener('click',()=>{audio();build(nPieces,false);jiggle(board,1.2);sBack()});

// ---------- start ----------
const HK={'#chikyu':'globe','#jisyaku':'magnet','#kingyo':'pond','#bidama':'marble'}[location.hash];if(HK)picKey=HK;
if(picKey in PLANETS)view='map';
newScene();layout();build(nPieces,false);if(view==='map'){updUI();mapFit(true);panHint=true;setTimeout(()=>toast(GL()?'指で回すと、ぐるりと一周見わたせます':'横にすべらせると、ほかの区画も見わたせます'),600)}
if(view!=='map'&&(location.hash==='#kansei'||HK)){for(const p of pieces)p.torn=true;stage='play';finish();panel.classList.remove('off')}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
requestAnimationFrame(frame);
})();
</script>
